<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRP PLAYERS DB</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Full-Screen Loading Overlay -->
<div id="loading-screen">
  <div class="loading-content">
    <img src="assets/logo.png" alt="Loading Logo" class="loading-spinner">
    <h2>LOADING DATABASE<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span></h2>
  </div>
</div>

<div class="scanlines" aria-hidden="true"></div>

<header class="masthead">
  <div class="masthead-bg-wrap">
    <div class="masthead-bg-track">
      <div class="masthead-bg" style="background-image:url('assets/header.jpg')"></div>
      <div class="masthead-bg" style="background-image:url('assets/header.jpg')"></div>
    </div>
  </div>
  <div class="masthead-inner">
    <div class="crest">
      <img src="assets/logo.png" alt="International Retro Patch crest" class="crest-img"
           onerror="this.style.display='none'"
           onload="this.nextElementSibling.style.display='none'">
      <span class="crest-fallback">IRP</span>
    </div>
    <div class="masthead-text">
      <p class="eyebrow">EA SPORTS FC™ 26</p>
      <h1 class="wordmark">INTERNATIONAL RETRO PATCH</h1>
      <h1 class="wordmark">PLAYERS DATABASE</h1>
    </div>
    <div class="masthead-actions">
      <div class="scoreboard-group">
        <button class="scoreboard active" id="squad-badge" type="button">
          <span class="scoreboard-label">Players</span>
          <span class="scoreboard-value" id="squad-count">000</span>
        </button>
        <button class="scoreboard" id="team-badge" type="button">
          <span class="scoreboard-label">Teams</span>
          <span class="scoreboard-value" id="team-count">00</span>
        </button>
      </div>
      <a class="discord-btn" href="https://discord.gg/ZBeHnvZEtE" target="_blank" rel="noopener noreferrer" aria-label="Join our Discord">
        <svg viewBox="0 -28.5 256 256" fill="currentColor"><path d="M216.856339,16.5966031 C200.285002,8.84328665 182.566144,3.2084988 164.041564,0 C161.766523,4.11318106 159.108624,9.64549908 157.276099,14.0464379 C137.583995,11.0849896 118.072967,11.0849896 98.7430163,14.0464379 C96.9108417,9.64549908 94.1925838,4.11318106 91.8971895,0 C73.3526068,3.2084988 55.6133949,8.86399117 39.0420583,16.6376612 C5.61752293,67.146514 -3.4433191,116.400813 1.08711069,164.955721 C23.2560196,181.510915 44.7403634,191.567697 65.8621325,198.148576 C71.0772151,190.971126 75.7283628,183.341335 79.7352139,175.300261 C72.104019,172.400575 64.7949724,168.822202 57.8887866,164.667963 C59.7209612,163.310589 61.5131304,161.891452 63.2445898,160.431257 C105.36741,180.133187 151.134928,180.133187 192.754523,160.431257 C194.506336,161.891452 196.298154,163.310589 198.110326,164.667963 C191.183787,168.842556 183.854737,172.420929 176.223542,175.320965 C180.230393,183.341335 184.861538,190.991831 190.096624,198.16893 C211.238746,191.588051 232.743023,181.531619 254.911949,164.955721 C260.227747,108.668201 245.831087,59.8662432 216.856339,16.5966031 Z M85.4738752,135.09489 C72.8290281,135.09489 62.4592217,123.290155 62.4592217,108.914901 C62.4592217,94.5396472 72.607595,82.7145587 85.4738752,82.7145587 C98.3405064,82.7145587 108.709962,94.5189427 108.488529,108.914901 C108.508531,123.290155 98.3405064,135.09489 85.4738752,135.09489 Z M170.525237,135.09489 C157.88039,135.09489 147.510584,123.290155 147.510584,108.914901 C147.510584,94.5396472 157.658606,82.7145587 170.525237,82.7145587 C183.391518,82.7145587 193.761324,94.5189427 193.539891,108.914901 C193.539891,123.290155 183.391518,135.09489 170.525237,135.09489 Z"/></svg>
      </a>
    </div>
  </div>
</header>

<main>
  <section class="squad-header" id="squad-header" hidden>
    <button class="squad-back-btn" id="squad-back-btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      Go back
    </button>
    <div class="squad-header-info">
      <img class="squad-header-crest" id="squad-header-crest" src="" alt="" onerror="this.style.display='none'">
      <h2 class="squad-header-name" id="squad-header-name"></h2>
    </div>
  </section>

  <section class="teams-grid" id="teams-grid" aria-live="polite" hidden></section>

  <section class="controls" aria-label="Filter and sort players" id="controls-section">
    <div class="control-group">
      <label for="search">Search</label>
      <input type="text" id="search" placeholder="" autocomplete="off">
    </div>
    <div class="control-group">
      <label for="position-filter">Position</label>
      <select id="position-filter">
        <option value="">All positions</option>
      </select>
    </div>
    <div class="control-group">
      <label for="sort-by">Sort by</label>
      <select id="sort-by">
        <option value="overall-desc">Overall (high–low)</option>
        <option value="overall-asc">Overall (low–high)</option>
        <option value="number-asc">Shirt number</option>
        <option value="name-asc">Name (A–Z)</option>
      </select>
    </div>
  </section>

  <p class="results-line" id="results-line">LOADING DATABASE…</p>

  <section class="card-grid" id="card-grid" aria-live="polite"></section>
</main>

<footer class="site-footer">
  <p>IRP is not affiliated with EA Sports or FIFA.</p>
</footer>

<!-- Detail overlay: back-of-the-sticker stat sheet -->
<div class="overlay" id="overlay" hidden>
  <div class="stat-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-name">
    <div class="sheet-toolbar">
      <button class="compare-btn" id="sheet-compare-btn" aria-label="Add to compare" title="Add to compare">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4"/><path d="M21 7H9"/><path d="M7 21l-4-4 4-4"/><path d="M3 17h12"/></svg>
      </button>
      <button class="share-btn" id="share-btn" aria-label="Copy shareable link" title="Copy link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      </button>
      <button class="download-btn" id="download-btn" aria-label="Download player card as PNG" title="Download card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      </button>
      <button class="close-btn" id="close-btn" aria-label="Close player sheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="sheet-header">
      <div class="sheet-portrait" id="sheet-portrait"></div>
      <div class="sheet-info">
        <div class="sheet-flags" id="sheet-nation"></div>
        <h2 id="sheet-name">Cristiano Ronaldo</h2>
        <p class="sheet-subline" id="sheet-meta">Real Madrid</p>
      </div>
      <div class="sheet-ratings">
        <div class="sheet-rating-box"><span class="sheet-rating-value" id="sheet-overall">94</span><span class="sheet-rating-label">OVR</span></div>
        <div class="sheet-rating-box pot"><span class="sheet-rating-value" id="sheet-potential">94</span><span class="sheet-rating-label">POT</span></div>
      </div>
    </div>

    <div class="sheet-body">
      <div class="six-stats" id="six-stats"></div>

      <div class="bio-grid" id="bio-grid"></div>

      <div class="playstyles-section" id="playstyles-section" hidden>
        <h3 class="playstyles-heading">PlayStyles</h3>
        <div class="playstyles-grid" id="playstyles-grid"></div>
      </div>

      <div class="attr-columns" id="attr-columns"></div>

      <div class="similar-section">
        <h3 class="similar-heading">Similar Players</h3>
        <div class="similar-grid" id="similar-grid"></div>
      </div>
    </div>
  </div>
</div>
<!-- Compare overlay: side-by-side stat comparison -->
<div class="overlay" id="compare-overlay" hidden>
  <div class="compare-sheet" role="dialog" aria-modal="true" aria-labelledby="compare-title">
    <div class="compare-toolbar">
      <button class="close-btn" id="compare-close-btn" aria-label="Close comparison">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="compare-sheet-header">
      <h2 id="compare-title">Player Comparison</h2>
    </div>
    <div class="compare-body" id="compare-body"></div>
  </div>
</div>

<!-- Floating compare tray -->
<div class="compare-bar" id="compare-bar" hidden>
  <div class="compare-bar-chips" id="compare-bar-chips"></div>
  <div class="compare-bar-actions">
    <button class="compare-clear-btn" id="compare-clear-btn">Clear</button>
    <button class="compare-go-btn" id="compare-go-btn" disabled>Compare (<span id="compare-count">0</span>)</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="script.js"></script>
</body>
</html>
