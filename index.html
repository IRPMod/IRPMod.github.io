<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>International Retro Patch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scanlines" aria-hidden="true"></div>

<header class="masthead">
  <div class="masthead-bg" style="background-image:url('assets/hero.jpg')"></div>
  <div class="masthead-inner">
    <div class="crest">
      <img src="assets/logo.png" alt="International Retro Patch crest" class="crest-img"
           onerror="this.style.display='none'"
           onload="this.nextElementSibling.style.display='none'">
      <span class="crest-fallback">IRP</span>
    </div>
    <div class="masthead-text">
      <p class="eyebrow">EA SPORTS FC™ 26</p>
      <h1 class="wordmark">INTERNATIONAL RETRO PATCH</h1>
      <h1 class="wordmark">PLAYERS DATABASE</h1>
    </div>
    <div class="scoreboard" id="squad-badge">
      <span class="scoreboard-label">Players</span>
      <span class="scoreboard-value" id="squad-count">000</span>
    </div>
  </div>
</header>

<main>
  <section class="controls" aria-label="Filter and sort players">
    <div class="control-group">
      <label for="search">Find a player</label>
      <input type="text" id="search" placeholder="Name, club, nation…" autocomplete="off">
    </div>
    <div class="control-group">
      <label for="position-filter">Position</label>
      <select id="position-filter">
        <option value="">All positions</option>
      </select>
    </div>
    <div class="control-group">
      <label for="sort-by">Sort by</label>
      <select id="sort-by">
        <option value="overall-desc">Overall (high–low)</option>
        <option value="overall-asc">Overall (low–high)</option>
        <option value="number-asc">Shirt number</option>
        <option value="name-asc">Name (A–Z)</option>
      </select>
    </div>
  </section>

  <p class="results-line" id="results-line">LOADING DATABASE…</p>

  <section class="card-grid" id="card-grid" aria-live="polite"></section>
</main>

<footer class="site-footer">
  <p>IRP is not affiliated with EA Sports or FIFA.</p>
</footer>

<!-- Detail overlay: back-of-the-sticker stat sheet -->
<div class="overlay" id="overlay" hidden>
  <div class="stat-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-name">
    <button class="close-btn" id="close-btn" aria-label="Close player sheet">&times;</button>
    <div class="sheet-header">
      <div class="sheet-portrait" id="sheet-portrait"></div>
      <div class="sheet-id">
        <span class="sheet-number" id="sheet-number">7</span>
        <div>
          <p class="sheet-nation" id="sheet-nation">Portugal</p>
          <h2 id="sheet-name">Cristiano Ronaldo</h2>
          <p class="sheet-meta" id="sheet-meta">Forward · Real Madrid</p>
        </div>
      </div>
      <div class="sheet-rating">
        <span class="sheet-rating-value" id="sheet-overall">94</span>
        <span class="sheet-rating-label">OVR</span>
        <span class="sheet-rating-value small" id="sheet-potential">94</span>
        <span class="sheet-rating-label">POT</span>
      </div>
    </div>

    <div class="sheet-body">
      <div class="six-stats" id="six-stats"></div>

      <div class="bio-grid" id="bio-grid"></div>

      <div class="attr-columns" id="attr-columns"></div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
