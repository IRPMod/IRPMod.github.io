<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRP PLAYERS DB</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Full-Screen Loading Overlay -->
<div id="loading-screen">
  <div class="loading-content">
    <img src="assets/logo.png" alt="Loading Logo" class="loading-spinner">
    <h2>LOADING DATABASE...</h2>
  </div>
</div>

<div class="scanlines" aria-hidden="true"></div>

<header class="masthead">
  <div class="masthead-bg" style="background-image:url('assets/header.jpg')"></div>
  <div class="masthead-inner">
    <div class="crest">
      <img src="assets/logo.png" alt="International Retro Patch crest" class="crest-img"
           onerror="this.style.display='none'"
           onload="this.nextElementSibling.style.display='none'">
      <span class="crest-fallback">IRP</span>
    </div>
    <div class="masthead-text">
      <p class="eyebrow">EA SPORTS FC™ 26</p>
      <h1 class="wordmark">INTERNATIONAL RETRO PATCH</h1>
      <h1 class="wordmark">PLAYERS DATABASE</h1>
    </div>
    <div class="scoreboard-group">
  <div class="scoreboard" id="squad-badge">
    <span class="scoreboard-label">Players</span>
    <span class="scoreboard-value" id="squad-count">000</span>
  </div>
  <div class="scoreboard" id="team-badge">
    <span class="scoreboard-label">Teams</span>
    <span class="scoreboard-value" id="team-count">00</span>
  </div>
</div>
  </div>
</header>

<main>
  <section class="controls" aria-label="Filter and sort players">
    <div class="control-group">
      <label for="search">Find a player</label>
      <input type="text" id="search" placeholder="Name, club, nation…" autocomplete="off">
    </div>
    <div class="control-group">
      <label for="position-filter">Position</label>
      <select id="position-filter">
        <option value="">All positions</option>
      </select>
    </div>
    <div class="control-group">
      <label for="sort-by">Sort by</label>
      <select id="sort-by">
        <option value="overall-desc">Overall (high–low)</option>
        <option value="overall-asc">Overall (low–high)</option>
        <option value="number-asc">Shirt number</option>
        <option value="name-asc">Name (A–Z)</option>
      </select>
    </div>
  </section>

  <p class="results-line" id="results-line">LOADING DATABASE…</p>

  <section class="card-grid" id="card-grid" aria-live="polite"></section>
</main>

<footer class="site-footer">
  <p>IRP is not affiliated with EA Sports or FIFA.</p>
</footer>

<!-- Detail overlay: back-of-the-sticker stat sheet -->
<div class="overlay" id="overlay" hidden>
  <div class="stat-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-name">
    <button class="close-btn" id="close-btn" aria-label="Close player sheet">&times;</button>
    <button class="share-btn" id="share-btn" aria-label="Copy shareable link" title="Copy link">🔗</button>
    <button class="download-btn" id="download-btn" aria-label="Download player card as PNG" title="Download card">⬇</button>
    <button class="compare-btn" id="sheet-compare-btn" aria-label="Add to compare" title="Add to compare">⇄</button>
    <div class="sheet-header">
      <div class="sheet-portrait" id="sheet-portrait"></div>
      <div class="sheet-id">
        <span class="sheet-number" id="sheet-number">7</span>
        <div>
          <p class="sheet-nation" id="sheet-nation">Portugal</p>
          <h2 id="sheet-name">Cristiano Ronaldo</h2>
          <p class="sheet-meta" id="sheet-meta">Forward · Real Madrid</p>
        </div>
      </div>
      <div class="sheet-rating">
        <span class="sheet-rating-value" id="sheet-overall">94</span>
        <span class="sheet-rating-label">OVR</span>
        <span class="sheet-rating-value small" id="sheet-potential">94</span>
        <span class="sheet-rating-label">POT</span>
      </div>
    </div>

    <div class="sheet-body">
      <div class="six-stats" id="six-stats"></div>

      <div class="bio-grid" id="bio-grid"></div>

      <div class="attr-columns" id="attr-columns"></div>

      <div class="similar-section">
        <h3 class="similar-heading">Similar Players</h3>
        <div class="similar-grid" id="similar-grid"></div>
      </div>
    </div>
  </div>
</div>
<!-- Compare overlay: side-by-side stat comparison -->
<div class="overlay" id="compare-overlay" hidden>
  <div class="compare-sheet" role="dialog" aria-modal="true" aria-labelledby="compare-title">
    <button class="close-btn" id="compare-close-btn" aria-label="Close comparison">&times;</button>
    <div class="compare-sheet-header">
      <h2 id="compare-title">Player Comparison</h2>
    </div>
    <div class="compare-body" id="compare-body"></div>
  </div>
</div>

<!-- Floating compare tray -->
<div class="compare-bar" id="compare-bar" hidden>
  <div class="compare-bar-chips" id="compare-bar-chips"></div>
  <div class="compare-bar-actions">
    <button class="compare-clear-btn" id="compare-clear-btn">Clear</button>
    <button class="compare-go-btn" id="compare-go-btn" disabled>Compare (<span id="compare-count">0</span>)</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="script.js"></script>
</body>
</html>
